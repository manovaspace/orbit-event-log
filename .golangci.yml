version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        # The domain is pure types, validation rules and ports. It imports no
        # driver, SQL engine, HTTP server or adapter.
        eventlog-domain:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: "database/sql"
              desc: "internal/domain declares the Store port; SQL lives in infrastructure"
            - pkg: "github.com/jackc/pgx"
              desc: "internal/domain has no database driver"
            - pkg: "github.com/pressly/goose"
              desc: "internal/domain has no migration runner"
            - pkg: "net/http"
              desc: "internal/domain has no HTTP server"
            - pkg: "os/exec"
              desc: "internal/domain is pure and runs no process"
            - pkg: "github.com/manovaspace/orbit-event-log/internal/infrastructure"
              desc: "internal/domain must not depend on an adapter"
        # The application layer reaches Postgres and the clock only through the
        # domain ports it receives in Deps.
        eventlog-application:
          files:
            - "**/internal/application/**"
          deny:
            - pkg: "database/sql"
              desc: "internal/application reaches Postgres through domain.Store"
            - pkg: "github.com/jackc/pgx"
              desc: "internal/application reaches Postgres through domain.Store"
            - pkg: "github.com/pressly/goose"
              desc: "internal/application has no migration runner"
            - pkg: "net/http"
              desc: "internal/application has no HTTP server"
            - pkg: "os/exec"
              desc: "internal/application runs no process"
            - pkg: "github.com/manovaspace/orbit-event-log/internal/infrastructure"
              desc: "internal/application must not depend on an adapter"
